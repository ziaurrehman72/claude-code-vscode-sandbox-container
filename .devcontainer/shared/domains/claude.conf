# =============================================================================
# claude.conf – Egress domains for Claude Code (AI_PROFILE contains "claude")
# =============================================================================
# Merged with common.conf at container start. Same format as common.conf.
#
# CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 is set in the claude/both
# variants, so telemetry and error-reporting endpoints are not needed.
# If Claude Code reports connection errors, check for denied domains:
#   grep DENIED /var/log/squid/access.log
# =============================================================================

# API (model requests)
api.anthropic.com

# Login (/login with a Claude subscription or Console account)
claude.ai
console.anthropic.com
platform.claude.com
