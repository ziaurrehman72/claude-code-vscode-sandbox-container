# =============================================================================
# common.conf – Egress domains allowed in EVERY variant
# =============================================================================
#
# At container start, egress-firewall.sh merges this file with the
# assistant-specific files selected by AI_PROFILE (copilot.conf, claude.conf)
# and converts the result into a Squid ACL. All other HTTP/HTTPS
# connections are blocked.
#
# FORMAT:
#   - One domain per line
#   - Blank lines and comments (#) are ignored
#   - Wildcard domains (*.example.com) match the base domain and
#     all subdomains
#   - Plain domains (example.com) match that exact domain only
#
# HOW IT WORKS:
#   Squid filters by domain name (from HTTP Host header or HTTPS
#   CONNECT request), NOT by IP address. This means CDN IP rotation
#   does not cause connectivity issues.
#
# EDITING:
#   Add new domains when MCP servers, APIs, or package registries need
#   to be reachable. After changes: rebuild the container.
#
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# GitHub – Git push/pull, API, raw content
# Note: *.githubusercontent.com covers raw, objects, avatars, camo, etc.
