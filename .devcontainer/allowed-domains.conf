# =============================================================================
# allowed-domains.conf – Whitelist of allowed egress domains
# =============================================================================
#
# This file defines which external domains the container is allowed to
# reach. All other HTTP/HTTPS connections are blocked by the Squid
# forward proxy.
#
# FORMAT:
#   - One domain per line
#   - Blank lines and comments (#) are ignored
#   - Wildcard domains (*.example.com) match the base domain and
#     all subdomains
#   - Plain domains (example.com) match that exact domain only
#
# HOW IT WORKS:
#   At container start, this file is converted into a Squid ACL.
#   Squid filters by domain name (from HTTP Host header or HTTPS
#   CONNECT request), NOT by IP address. This means CDN IP rotation
#   does not cause connectivity issues.
#
# EDITING:
#   Add new domains when MCP servers, APIs, or package registries need
#   to be reachable. After changes: restart the container.
#
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# GitHub – Copilot API, Git push/pull, Copilot proxy
